<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KQ-06 | Peşə təhsili attestasiyası | 20-lik test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fafc);color:#172033}.wrap{max-width:920px;margin:auto;padding:18px}.hero,.card{background:#fff;border-radius:18px;box-shadow:0 8px 30px #1e3a8a12;border:1px solid #e8edf5}.hero{padding:24px;margin-bottom:16px;background:linear-gradient(135deg,#172554,#315efb);color:#fff}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:5px 0;color:#dbe7ff}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:8px 12px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff2e;font-size:14px}.card{padding:20px;margin:14px 0}.q{font-size:18px;font-weight:750;line-height:1.55;margin-bottom:14px}.opt{display:block;border:1px solid #dce3ef;border-radius:12px;padding:13px 14px;margin:9px 0;cursor:pointer;transition:.15s;background:#fff}.opt:hover{background:#f5f8ff;border-color:#9db4ff}.opt input{margin-right:8px}.btn{border:0;border-radius:12px;padding:13px 18px;background:#315efb;color:#fff;font-weight:700;cursor:pointer;font-size:15px}.btn.secondary{background:#64748b}.btn.danger{background:#dc2626}.actions{display:flex;gap:10px;flex-wrap:wrap}.bar{height:10px;background:#dbe4f4;border-radius:99px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#fff;border-radius:99px;transition:.25s}.muted{color:#667085}.hidden{display:none}.resultScore{font-size:34px;font-weight:800}.review{padding:16px 0;border-top:1px solid #e5e7eb}.correct{background:#ecfdf3;border:1px solid #86efac;padding:10px;border-radius:10px}.wrong{background:#fef2f2;border:1px solid #fca5a5;padding:10px;border-radius:10px}.source{font-size:12px;color:#667085;margin-top:9px;line-height:1.5}.loading{text-align:center;padding:40px}.footer{text-align:center;color:#667085;font-size:12px;padding:18px}@media(max-width:600px){.wrap{padding:10px}.hero h1{font-size:23px}.card{padding:15px}.q{font-size:16px}}
</style>
</head>
<body><div class="wrap"><section class="hero"><h1>KQ-06 Attestasiya Testi</h1><p>“Peşə təhsili pilləsində təhsilalanların attestasiyasının aparılması Qaydası” əsasında hazırlanmış 150 suallıq interaktiv test.</p><div class="stats"><span class="pill" id="pool">0/150 istifadə olunub</span><span class="pill" id="batchInfo">20 sual/cəhd</span></div><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div></section><div id="app" class="loading">Test yüklənir...</div><div class="footer">Rəqəmsal Zəka Platforması • KQ-06</div></div>
<script>
const DATA_URL='kq-06-attestasiya-data.txt';const KEY='kq06_attestasiya_used_v3',CURRENT='kq06_attestasiya_current_v3';let QUESTIONS=[],batch=[],answers={};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function status(){const u=load(KEY,[]);document.getElementById('pool').textContent=`${u.length}/${QUESTIONS.length} istifadə olunub`;document.getElementById('fill').style.width=(QUESTIONS.length?u.length/QUESTIONS.length*100:0)+'%'}
async function loadQuestions(){const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw Error('Məlumat faylı yüklənmədi');const b64=(await r.text()).trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('deflate');const out=await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();QUESTIONS=JSON.parse(new TextDecoder().decode(out));status();start()}
function start(){let cur=load(CURRENT,null),used=load(KEY,[]);if(cur?.batch?.length){batch=cur.batch;answers=cur.answers||{};render();return}if(used.length>=QUESTIONS.length){used=[];save(KEY,[])}const available=QUESTIONS.map((_,i)=>i).filter(i=>!used.includes(i));batch=shuffle(available).slice(0,Math.min(20,available.length));answers={};save(KEY,[...used,...batch]);save(CURRENT,{batch,answers});render()}
function render(){document.getElementById('batchInfo').textContent=`${batch.length} sual/cəhd`;const box=document.getElementById('app');box.innerHTML=batch.map((idx,n)=>{const q=QUESTIONS[idx];return `<section class="card"><div class="q">${n+1}. ${esc(q.q)}</div>${q.a.map((x,k)=>{const l=String.fromCharCode(65+k);return `<label class="opt"><input type="radio" name="q${n}" value="${l}" ${answers[n]===l?'checked':''} onchange="answers[${n}]=this.value;save(CURRENT,{batch,answers})"> <b>${l})</b> ${esc(x)}</label>`}).join('')}</section>`}).join('')+`<section class="card"><div class="actions"><button class="btn" onclick="finish()">Nəticəni göstər</button><button class="btn danger" onclick="resetPool()">Hovuzu sıfırla</button></div></section>`;status()}
function finish(){let correct=0;batch.forEach((idx,n)=>{if(answers[n]===QUESTIONS[idx].c)correct++});const total=batch.length,pct=Math.round(correct/total*100),used=load(KEY,[]);save(CURRENT,null);document.getElementById('app').innerHTML=`<section class="card"><h2>Nəticə</h2><div class="resultScore">${correct}/${total}</div><p><b>${pct}%</b> düzgün cavab</p><p class="muted">${used.length>=QUESTIONS.length?'150 sualın hamısı istifadə edildi. Növbəti cəhddə hovuz avtomatik sıfırlanacaq.':'Növbəti cəhddə yeni suallar təqdim olunacaq.'}</p><div class="actions"><button class="btn" onclick="start()">Yenidən ${used.length>=QUESTIONS.length?20:Math.min(20,QUESTIONS.length-used.length)} sual</button><button class="btn secondary" onclick="review()">Cavabları yoxla</button></div><div id="reviews"></div></section>`;status()}
function review(){let h='';batch.forEach((idx,n)=>{const q=QUESTIONS[idx],sel=answers[n]||'Cavab verilməyib',ok=sel===q.c;h+=`<div class="review"><b>${n+1}. ${esc(q.q)}</b><div class="${ok?'correct':'wrong'}">Sizin cavabınız: <b>${esc(sel)}</b><br>Düzgün cavab: <b>${esc(q.c)}) ${esc(q.a[q.c.charCodeAt(0)-65])}</b></div><div class="source">${esc(q.s)}</div></div>`});document.getElementById('reviews').innerHTML=h}function resetPool(){if(confirm('İstifadə edilmiş bütün suallar sıfırlansın?')){localStorage.removeItem(KEY);localStorage.removeItem(CURRENT);start()}}loadQuestions().catch(e=>{document.getElementById('app').innerHTML='<section class="card"><h2>Test yüklənmədi</h2><p>Məlumat faylına giriş mümkün olmadı. Səhifəni yeniləyin.</p></section>'});
</script></body></html>
