<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KQ-06 | Peşə təhsili attestasiyası | 20-lik test</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 5px 20px #00000010}h1{margin-top:0}.muted{color:#657084}.q{font-weight:700;font-size:18px;line-height:1.5}.opt{display:block;border:1px solid #d9dfeb;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.opt:hover{background:#f1f5ff}.btn{border:0;border-radius:10px;padding:12px 18px;background:#315efb;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#64748b}.bar{height:9px;background:#e5eaf3;border-radius:8px;overflow:hidden}.fill{height:100%;background:#315efb}.correct{border-color:#16a34a;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}.source{font-size:13px;color:#667085;margin-top:10px}.hidden{display:none}.stat{font-weight:700}.review{border-top:1px solid #e5e7eb;padding:15px 0}.small{font-size:14px}
</style></head>
<body><div class="wrap">
<div class="card"><h1>KQ-06 Attestasiya Testi</h1><p class="muted">“Peşə təhsili pilləsində təhsilalanların attestasiyasının aparılması Qaydası” əsasında 150 suallıq test bankı.</p><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><p id="status" class="stat"></p><p class="small">Hər cəhddə maksimum 20 yeni sual təqdim olunur. Suallar bütün hovuz istifadə olunana qədər təkrarlanmır. 150 sual bitdikdən sonra hovuz avtomatik sıfırlanır.</p></div>
<div id="quiz"></div><div id="result" class="card hidden"></div>
</div>
<script>
const QUESTIONS = __QUESTIONS__;
const KEY='kq06_attestasiya_used_v1', CURRENT='kq06_attestasiya_current_v1';
let batch=[], answers={};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function updateStatus(){let used=load(KEY,[]);document.getElementById('status').textContent=`İstifadə olunan: ${used.length}/${QUESTIONS.length} | Bu cəhddə: ${batch.length} sual`;document.getElementById('fill').style.width=(used.length/QUESTIONS.length*100)+'%'}
function start(){
 let current=load(CURRENT,null);let used=load(KEY,[]);
 if(current&&current.batch&&current.batch.length){batch=current.batch;answers=current.answers||{};render();return}
 if(used.length>=QUESTIONS.length){used=[];save(KEY,[])}
 let available=QUESTIONS.map((_,i)=>i).filter(i=>!used.includes(i));batch=shuffle(available).slice(0,Math.min(20,available.length));answers={};save(KEY,[...used,...batch]);save(CURRENT,{batch,answers});render();updateStatus();
}
function render(){let box=document.getElementById('quiz');document.getElementById('result').classList.add('hidden');box.innerHTML=batch.map((idx,n)=>{let q=QUESTIONS[idx];return `<div class="card"><div class="q">${n+1}. ${esc(q.q)}</div>${q.a.map((x,k)=>`<label class="opt"><input type="radio" name="q${n}" value="${String.fromCharCode(65+k)}" ${answers[n]===String.fromCharCode(65+k)?'checked':''} onchange="answers[${n}]=this.value;save(CURRENT,{batch,answers})"> ${String.fromCharCode(65+k)}) ${esc(x)}</label>`).join('')}</div>`}).join('')+`<div class="card"><button class="btn" onclick="finish()">Nəticəni göstər</button></div>`;updateStatus()}
function finish(){
 let correct=0;batch.forEach((idx,n)=>{if(answers[n]===QUESTIONS[idx].c)correct++});let total=batch.length,pct=Math.round(correct/total*100);let used=load(KEY,[]);save(CURRENT,null);document.getElementById('quiz').innerHTML='';let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>Nəticə</h2><p class="stat">${correct}/${total} doğru • ${pct}%</p><p>${used.length>=QUESTIONS.length?'Bütün 150 sual tamamlandı. Növbəti cəhddə sual hovuzu avtomatik sıfırlanacaq.':'Növbəti cəhddə yeni suallar təqdim olunacaq.'}</p><button class="btn" onclick="start()">Yenidən ${Math.min(20,QUESTIONS.length-used.length)} sual</button><button class="btn secondary" style="margin-left:8px" onclick="review()">Cavabları yoxla</button><div id="reviews"></div>`;updateStatus()}
function review(){let h='';batch.forEach((idx,n)=>{let q=QUESTIONS[idx],sel=answers[n]||'Cavab verilməyib',ok=sel===q.c;h+=`<div class="review"><b>${n+1}. ${esc(q.q)}</b><p class="${ok?'correct':'wrong'}">Sizin cavabınız: ${esc(sel)} | Düzgün cavab: ${esc(q.c)}</p><div class="source">${esc(q.s)}</div></div>`});document.getElementById('reviews').innerHTML=h}
start();
</script></body></html>
