<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KQ-06 | 150 suallıq interaktiv test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 30px #17203312}h1{margin:0 0 8px;font-size:28px}.muted{color:#667085;line-height:1.5}.top{position:sticky;top:0;z-index:5;background:#f5f7fb;padding-bottom:8px}.bar{height:10px;background:#e4e8f0;border-radius:20px;overflow:hidden}.fill{height:100%;background:#315efb;transition:.3s}.stat{font-weight:700;margin:10px 0}.q{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:14px}.opt{display:block;border:1px solid #d9dfeb;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer;line-height:1.4}.opt:hover{background:#f4f7ff}.opt input{margin-right:8px}.btn{border:0;border-radius:11px;padding:12px 18px;background:#315efb;color:white;font-weight:700;cursor:pointer;margin:4px}.btn.secondary{background:#64748b}.hidden{display:none}.source{font-size:13px;color:#667085;margin-top:9px}.correct{border-color:#16a34a;background:#ecfdf3}.wrong{border-color:#dc2626;background:#fef2f2}.review{border-top:1px solid #e5e7eb;padding:14px 0}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eef2ff;color:#315efb;font-weight:700;font-size:13px}@media(max-width:600px){.wrap{padding:10px}.card{padding:17px}h1{font-size:23px}.q{font-size:17px}}</style></head><body><div class="wrap"><div class="top"><div class="card"><span class="badge">KQ-06</span><h1>Peşə təhsili attestasiyası</h1><p class="muted">“Peşə təhsili pilləsində təhsilalanların attestasiyasının aparılması Qaydası” əsasında hazırlanmış 150 suallıq interaktiv test.</p><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><div id="status" class="stat"></div><button class="btn secondary" onclick="resetPool()">Hovuzu sıfırla</button></div></div><div id="quiz"></div><div id="result" class="card hidden"></div></div><script>
const QUESTIONS=__QUESTIONS__;const KEY='kq06_attestasiya_used_v2',CURRENT='kq06_attestasiya_current_v2';let batch=[],answers={};function load(k,d){try{let x=JSON.parse(localStorage.getItem(k));return x??d}catch(e){return d}}function save(k,v){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function updateStatus(){let used=load(KEY,[]);document.getElementById('status').textContent=`İstifadə olunan: ${used.length}/150 • Bu cəhddə: ${batch.length} sual`;document.getElementById('fill').style.width=(used.length/150*100)+'%'}function start(){let cur=load(CURRENT,null),used=load(KEY,[]);if(cur?.batch?.length){batch=cur.batch;answers=cur.answers||{};render();return}if(used.length>=QUESTIONS.length){used=[];save(KEY,[])}let available=QUESTIONS.map((_,i)=>i).filter(i=>!used.includes(i));batch=shuffle(available).slice(0,Math.min(20,available.length));answers={};save(KEY,[...used,...batch]);save(CURRENT,{batch,answers});render()}function render(){document.getElementById('result').classList.add('hidden');document.getElementById('quiz').innerHTML=batch.map((idx,n)=>{let q=QUESTIONS[idx];return `<div class="card"><div class="q">${n+1}. ${esc(q[0])}</div>${q[1].map((x,k)=>{let l=String.fromCharCode(65+k);return `<label class="opt"><input type="radio" name="q${n}" value="${l}" ${answers[n]===l?'checked':''} onchange="answers[${n}]=this.value;save(CURRENT,{batch,answers})"> ${l}) ${esc(x)}</label>`}).join('')}</div>`}).join('')+`<div class="card"><button class="btn" onclick="finish()">Nəticəni göstər</button></div>`;updateStatus();window.scrollTo({top:0,behavior:'smooth'})}function finish(){let correct=0;batch.forEach((idx,n)=>{if(answers[n]===QUESTIONS[idx][2])correct++});let total=batch.length,pct=Math.round(correct/total*100),used=load(KEY,[]);save(CURRENT,null);document.getElementById('quiz').innerHTML='';let r=document.getElementById('result');r.classList.remove('hidden');let remaining=QUESTIONS.length-used.length;r.innerHTML=`<h2>Nəticə</h2><p class="stat">${correct}/${total} doğru • ${pct}%</p><p class="muted">${remaining===0?'150 sualın hamısı istifadə edildi. Növbəti cəhddə hovuz avtomatik sıfırlanacaq.':remaining+' yeni sual hələ qalıb.'}</p><button class="btn" onclick="start()">Yenidən sual seç</button><button class="btn secondary" onclick="review()">Cavabları yoxla</button><div id="reviews"></div>`;updateStatus()}function review(){let h='';batch.forEach((idx,n)=>{let q=QUESTIONS[idx],sel=answers[n]||'Cavab verilməyib',ok=sel===q[2];h+=`<div class="review"><b>${n+1}. ${esc(q[0])}</b><p class="${ok?'correct':'wrong'}">Sizin cavabınız: ${esc(sel)} • Düzgün cavab: ${esc(q[2])}</p><div class="source">${esc(q[3])}</div></div>`});document.getElementById('reviews').innerHTML=h}function resetPool(){if(confirm('İstifadə olunmuş suallar sıfırlansın?')){save(KEY,null);save(CURRENT,null);batch=[];answers={};start()}}start();</script></body></html>
