<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müəllimin Aİ Köməkçisi</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}#status{font-family:Arial,sans-serif;padding:24px;text-align:center;color:#475569}#status h2{color:#1e3a8a}#frame{width:100%;height:100%;border:0;display:none}
</style>
</head>
<body>
<div id="status"><h2>🤖 Müəllimin Aİ Köməkçisi</h2><p>Sistem yüklənir...</p></div>
<script>
(async()=>{
 try{
  const r=await fetch('https://raw.githubusercontent.com/RZP26/Reqemsal-Zeka-Platformasi/main/README.md?raw=1',{cache:'no-store'});
  if(!r.ok) throw new Error('README yüklənmədi');
  const html=await r.text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('status').innerHTML='<h2>Yükləmə xətası</h2><p>README.md faylı yüklənə bilmədi. Səhifəni yeniləyin.</p>';
 }
})();
</script>
</body>
</html>
