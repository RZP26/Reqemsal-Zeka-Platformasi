<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Müəllimin AI Köməkçisi | Admin</title><style>body{font-family:Inter,Arial;background:#f6f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:15px 0}input,button{padding:10px;border:1px solid #ddd;border-radius:9px}button{cursor:pointer;font-weight:700}.primary{background:#4f46e5;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>⚙️ Müəllimin AI Köməkçisi | Admin Panel</h1><p>Giriş kodları, aktiv sessiyalar və mənbə bazası.</p><div id="login" class="card"><h2>Admin girişi</h2><input id="u" placeholder="İstifadəçi adı"><input id="p" type="password" placeholder="Şifrə"><button class="primary" onclick="start()">Daxil ol</button></div><div id="panel" style="display:none"><div class="grid"><section class="card"><h2>🔑 Yeni giriş kodu</h2><input id="label" placeholder="Müəllim adı/etiket"><input id="expires" type="datetime-local"><button class="primary" onclick="createCode()">Kod yarat</button><pre id="newcode"></pre></section><section class="card"><h2>📚 Mənbə əlavə et</h2><input id="stitle" placeholder="Sənəd adı"><input id="scat" placeholder="Kateqoriya"><input id="surl" placeholder="Rəsmi URL"><button class="primary" onclick="source()">Əlavə et</button></section></div><section class="card"><h2>Aktiv sessiyalar</h2><div id="sessions"></div></section><section class="card"><h2>Giriş kodları</h2><div id="codes"></div></section><section class="card"><h2>Mənbə bazası</h2><div id="sources"></div></section></div></div><script>let auth='';const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:auth};const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Xəta');return d}async function start(){auth='Basic '+btoa($('u').value+':'+$('p').value);try{await load();$('login').style.display='none';$('panel').style.display='block'}catch(e){alert(e.message)}}async function createCode(){const d=await api('/api/admin/codes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:$('label').value,expires_at:$('expires').value?new Date($('expires').value).toISOString():null})});$('newcode').textContent='YENİ KOD: '+d.code;load()}async function load(){const [s,c,src]=await Promise.all([api('/api/admin/sessions'),api('/api/admin/codes'),api('/api/admin/sources')]);$('sessions').innerHTML='<table class=table><tr><th>Etiket</th><th>Son aktivlik</th><th>Bitmə</th><th></th></tr>'+s.map(x=>`<tr><td>${x.label}</td><td>${x.last_activity}</td><td>${x.expires_at}</td><td><button onclick="closeS('${x.id}')">Sessiyanı bağla</button></td></tr>`).join('')+'</table>';$('codes').innerHTML='<table class=table><tr><th>Etiket</th><th>Status</th><th>Aktiv sessiya</th><th></th></tr>'+c.map(x=>`<tr><td>${x.label}</td><td>${x.active?'Aktiv':'Deaktiv'}</td><td>${x.active_session_id||'Yoxdur'}</td><td><button onclick="toggle(${x.id},${!x.active})">${x.active?'Deaktiv et':'Aktiv et'}</button></td></tr>`).join('')+'</table>';$('sources').innerHTML='<table class=table><tr><th>Sənəd</th><th>Kateqoriya</th><th>URL</th><th>Status</th></tr>'+src.map(x=>`<tr><td>${x.title}</td><td>${x.category}</td><td><a href="${x.official_url}" target="_blank">Keçid</a></td><td>${x.status}</td></tr>`).join('')+'</table>'}async function closeS(id){await api('/api/admin/sessions/'+id+'/close',{method:'POST'});load()}async function toggle(id,active){await api('/api/admin/codes/'+id+'/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});load()}async function source(){await api('/api/admin/sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('stitle').value,category:$('scat').value,official_url:$('surl').value})});load()}</script></body></html>
