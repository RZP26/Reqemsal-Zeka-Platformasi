<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Müəllimin AI Köməkçisi"><title>Müəllimin AI Köməkçisi</title><style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e5e7eb;--ok:#059669;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#c4b5fd55,transparent 35%),linear-gradient(135deg,#312e81,#4f46e5)}.login-card{width:min(460px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 30px 80px #11182755}.brand{display:flex;gap:12px;align-items:center;font-weight:900;font-size:22px}.brand-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#eef2ff;color:var(--p);font-size:25px}.muted{color:var(--muted)}.login h1{font-size:28px;margin:28px 0 8px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field textarea{min-height:130px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:800;display:inline-flex;gap:8px;align-items:center;justify-content:center}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.ghost{background:#f1f5f9;color:#334155}.danger{background:#fee2e2;color:#991b1b}.full{width:100%}.app{display:none;min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:700}.hamb{display:none;border:0;background:#f1f5f9;border-radius:10px;padding:10px}.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:280px;background:#fff;border-right:1px solid var(--line);padding:15px 11px;overflow:auto}.side h4{font-size:10px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin:16px 10px 8px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;color:#334155;font-weight:700;font-size:13px}.nav:hover,.nav.active{background:#eef2ff;color:#4338ca}.main{flex:1;padding:25px;max-width:1500px;margin:auto;width:100%}.hero{background:linear-gradient(135deg,#312e81,#6366f1);color:#fff;border-radius:24px;padding:30px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(25px,4vw,40px)}.hero p{margin:0;color:#e0e7ff;max-width:780px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{font-size:27px;display:block}.workspace{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.module-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.module-head h2{margin:0}.upload{border:2px dashed #c7d2fe;background:#f8faff;border-radius:15px;padding:17px;text-align:center;margin:14px 0}.upload input{display:none}.upload label{cursor:pointer;color:#4338ca;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.result{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden}.result-head{background:#312e81;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.result-body{padding:20px;line-height:1.7;white-space:pre-wrap;min-height:120px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:13px}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;margin:12px 0}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:100}.about{display:grid;grid-template-columns:1fr 1fr;gap:20px}.module-icon{font-size:30px}.recent{display:grid;gap:8px}.recent button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;cursor:pointer}.admin{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:15px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:250px}}@media(max-width:760px){.hamb{display:block}.side{position:fixed;left:-290px;top:68px;bottom:0;z-index:30;transition:.2s;box-shadow:10px 0 30px #11182718}.side.open{left:0}.main{padding:15px}.grid2,.about{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.top{padding:0 12px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.hero{padding:22px}}
</style></head><body>
<section id="login" class="login"><div class="login-card"><div class="brand"><div class="brand-icon">🤖</div><div>Müəllimin AI Köməkçisi<small>AI əsaslı EdTech platforması</small></div></div><h1>Müəllim girişi</h1><p class="muted">Sistemə daxil olmaq üçün admin tərəfindən təqdim edilmiş unikal giriş kodunu daxil edin.</p><div class="field"><label>Giriş kodu</label><input id="code" type="password" autocomplete="one-time-code" placeholder="Giriş kodunu daxil edin"></div><button id="loginBtn" class="btn primary full">Daxil ol</button><div id="loginError" class="notice hidden"></div></div></section>
<section id="app" class="app"><header class="top"><button id="hamb" class="hamb">☰</button><div class="brand"><div class="brand-icon">🤖</div><div>Müəllimin AI Köməkçisi<small>Peşəkar rəqəmsal müəllim köməkçisi</small></div></div><button id="logout" class="btn ghost">Çıxış</button></header><div class="layout"><aside id="side" class="side"><h4>Əsas</h4><button class="nav active" data-module="dashboard">🏠 Ana səhifə</button><h4>Planlaşdırma</h4><button class="nav" data-module="teqvim-tematik">📅 Təqvim-tematik plan</button><button class="nav" data-module="ders-plani">📚 Dərs planı</button><button class="nav" data-module="ders-ssenarisi">🎬 Dərs ssenarisi</button><button class="nav" data-module="interaktiv-metodlar">💡 İnteraktiv metodlar</button><h4>Qiymətləndirmə</h4><button class="nav" data-module="ksq">📊 Kiçik summativ qiymətləndirmə</button><button class="nav" data-module="bsq">🏆 Böyük summativ qiymətləndirmə</button><button class="nav" data-module="telim-neticesi">🎯 Təlim nəticələrinin qiymətləndirilməsi</button><button class="nav" data-module="seristte">🛠 Səriştə qiymətləndirilməsi</button><button class="nav" data-module="netice">📈 Nəticələrin yoxlanılması</button><h4>Materiallar</h4><button class="nav" data-module="ev-tapsirigi">📝 Ev tapşırığı</button><button class="nav" data-module="test">🧠 Test və sual generatoru</button><button class="nav" data-module="ppt">🎨 PowerPoint təqdimatı</button><button class="nav" data-module="chat">🤖 AI Çat</button><button class="nav" data-module="qanun">📖 Təhsil qanunvericiliyi</button><button class="nav" data-module="kurikulum">📚 Kurikulum və standartlar</button><button class="nav" data-module="fayl">📁 Fayl analizi</button><button class="nav" data-module="works">🗂 İşlərim</button><button class="nav" data-module="about">ℹ️ Haqqında</button></aside><main id="main" class="main"></main></div></section><div id="toast" class="toast"></div>
<script>
const S={sid:localStorage.getItem('teacher_sid')};const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const labels={ 'teqvim-tematik':'Təqvim-tematik plan','ders-plani':'Dərs planı','ders-ssenarisi':'Dərs ssenarisi','interaktiv-metodlar':'İnteraktiv metodlar','ksq':'Kiçik summativ qiymətləndirmə','bsq':'Böyük summativ qiymətləndirmə','telim-neticesi':'Təlim nəticələrinin qiymətləndirilməsi','seristte':'Səriştə qiymətləndirilməsi','netice':'Nəticələrin yoxlanılması','ev-tapsirigi':'Ev tapşırığı','test':'Test və sual generatoru','ppt':'PowerPoint təqdimatı','chat':'AI Çat','qanun':'Təhsil qanunvericiliyi','kurikulum':'Kurikulum və standartlar','fayl':'Fayl analizi'};
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',3000)}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(S.sid?{'x-session-id':S.sid}:{})};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Sessiya bitib')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xəta baş verdi');return d}
async function login(){try{const d=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value})});S.sid=d.session_id;localStorage.setItem('teacher_sid',S.sid);showApp();load('dashboard')}catch(e){$('#loginError').textContent=e.message;$('#loginError').classList.remove('hidden')}}
async function logout(){if(S.sid)try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('teacher_sid');S.sid=null;$('#app').style.display='none';$('#login').style.display='grid'}
function showApp(){$('#login').style.display='none';$('#app').style.display='block'}
function dashboard(d){return `<div class="hero"><h1>Müəllimin AI Köməkçisinə xoş gəlmisiniz 👋</h1><p>Dərsinizi planlaşdırın, qiymətləndirin, təhlil edin və sənədlərinizi real Office formatlarında hazırlayın.</p></div><div class="cards"><div class="stat">📚<b>${d.count}</b><span>Hazırlanmış material</span></div><div class="stat">📅<b>${d.date}</b><span>Bu gün</span></div><div class="stat">🤖<b>AI</b><span>Peşəkar metodik dəstək</span></div><div class="stat">🔐<b>30 dəq</b><span>Fəaliyyətsizlik timeout-u</span></div></div><div class="workspace" style="margin-top:18px"><h2>Sürətli giriş</h2><div class="chips">${Object.entries(labels).slice(0,8).map(([k,v])=>`<button class="chip" onclick="load('${k}')">${v}</button>`).join('')}</div><h3>Son işlər</h3><div class="recent">${(d.recent||[]).map(x=>`<button onclick="openMaterial(${x.id})"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.module)} · ${esc(x.updated_at)}</span></button>`).join('')||'<p class="muted">Hələ material yaradılmayıb.</p>'}</div></div>`}
function uploadBox(){return `<div class="upload">📎 <label>Və ya Fayl Seçin<br><small>(Şəkil - PNG, JPG və ya PDF Sənədi)</small><input id="file" type="file" accept="image/png,image/jpeg,application/pdf"></label><div id="fileName" class="muted"></div></div>`}
function formFor(m){const base=`<div class="field"><label>Mövzu / tapşırıq</label><textarea id="prompt" placeholder="Mövzunu və istədiyiniz nəticəni yazın..."></textarea></div>`;if(m==='test')return `<div class="grid2"><div class="field"><label>Mövzu</label><input id="topic"></div><div class="field"><label>Sual sayı</label><input id="count" type="number" value="10" min="1" max="100"></div><div class="field"><label>Çətinlik</label><select id="difficulty"><option>Orta</option><option>Asan</option><option>Çətin</option></select></div><div class="field"><label>Variant sayı</label><select id="variants"><option>4</option><option>3</option><option>2</option></select></div></div>`;if(m==='ppt')return `<div class="grid2"><div class="field"><label>Mövzu</label><input id="topic"></div><div class="field"><label>Slayd sayı</label><input id="slides" type="number" value="8" min="3" max="30"></div><div class="field"><label>Auditoriya</label><input id="audience" placeholder="Məsələn: 9-cu sinif"></div><div class="field"><label>Dizayn üslubu</label><select id="style"><option>Professional EdTech</option><option>Minimalist</option><option>Akademik</option></select></div></div>`;if(m==='netice')return `<div class="field"><label>20 nəfərə qədər nəticə cədvəli</label><textarea id="prompt" placeholder="№ | Ad Soyad | Tapşırıq 1 | Tapşırıq 2 | Tapşırıq 3 | Bal\n1 | Əli Əliyev | 8 | 7 | 9 | 24"></textarea></div>`;return base}
function moduleView(m){return `<div class="workspace"><div class="module-head"><div><div class="module-icon">${m==='ppt'?'🎨':'🤖'}</div><h2>${labels[m]}</h2><p class="muted">AI ilə strukturlaşdırılmış, praktik və birbaşa istifadə edilə bilən nəticə hazırlayın.</p></div></div>${formFor(m)}${uploadBox()}<div class="actions"><button class="btn primary" onclick="generate('${m}')">✨ AI ilə hazırla</button><button class="btn ghost" onclick="clearForm()">Təmizlə</button></div><div id="result"></div></div>`}
async function generate(m){const f=$('#file')?.files[0];const fd=new FormData();fd.append('module',m);let prompt=$('#prompt')?.value||'';if(m==='test')prompt=`Mövzu: ${$('#topic').value}; ${$('#count').value} sual; ${$('#difficulty').value}; ${$('#variants').value} variant. A/B/C/D formatında bir doğru cavab və sonda cavab açarı.`;if(m==='ppt')prompt=`Mövzu: ${$('#topic').value}; ${$('#slides').value} slayd; auditoriya: ${$('#audience').value}; üslub: ${$('#style').value}. Slaydları JSON obyektləri kimi də strukturlaşdır.`;fd.append('prompt',prompt);fd.append('title',labels[m]);if(f)fd.append('file',f);$('#result').innerHTML='<div class="result"><div class="result-head">Hazırlanır...</div><div class="result-body">AI işləyir...</div></div>';try{const d=await api('/api/ai',{method:'POST',body:fd});renderResult(d,m)}catch(e){$('#result').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function renderResult(d,m){window.current=d;$('#result').innerHTML=`<div class="result"><div class="result-head"><span>${esc(d.title)}</span><div class="actions"><button class="btn ghost" onclick="downloadDocx()">📥 Word kimi yüklə</button><button class="btn ghost" onclick="saveCurrent()">🗂 İşlərimdə saxla</button><button class="btn ghost" onclick="generate('${m}')">🔄 Yenidən yarat</button><button class="btn ghost" onclick="copyCurrent()">📋 Kopyala</button>${m==='ppt'?'<button class="btn ghost" onclick="downloadPptx()">🎨 PowerPoint kimi yüklə</button>':''}</div></div><div id="content" class="result-body">${esc(d.content)}</div></div>`}
async function downloadDocx(){const r=await fetch('/api/export/docx',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':S.sid},body:JSON.stringify({title:window.current.title,content:window.current.content})});const b=await r.blob();saveBlob(b,'muellimin-ai-komekcisi.docx')}
async function downloadPptx(){const text=window.current.content;const slides=text.split(/\n(?=(?:SLAYD|Slide|\d+\.)\s)/i).map((x,i)=>({title:i?x.split('\n')[0]:'Təqdimat',body:i?x.split('\n').slice(1).join('\n'):x}));const r=await fetch('/api/export/pptx',{method:'POST',headers:{'Content-Type':'application/json','x-session-id':S.sid},body:JSON.stringify({slides})});const b=await r.blob();saveBlob(b,'muellimin-ai-komekcisi.pptx')}
function saveBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();URL.revokeObjectURL(a.href)}
async function saveCurrent(){toast('Nəticə İşlərimə avtomatik saxlanılıb.')}async function copyCurrent(){await navigator.clipboard.writeText(window.current.content);toast('Kopyalandı')}function clearForm(){document.querySelectorAll('textarea,input').forEach(x=>{if(x.type!=='file')x.value='' });$('#result').innerHTML=''}
async function openMaterial(id){const a=await api('/api/materials');const x=a.find(y=>y.id===id);if(x){window.current=x;$('#main').innerHTML=`<div class="workspace"><h2>${esc(x.title)}</h2><p class="muted">${esc(x.module)}</p><textarea id="edit" class="field" style="width:100%;min-height:450px">${esc(x.content)}</textarea><div class="actions"><button class="btn primary" onclick="updateMaterial(${id})">💾 Saxla</button><button class="btn ghost" onclick="downloadDocx()">📥 Word kimi yüklə</button></div></div>`}}
async function updateMaterial(id){await api('/api/materials/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:window.current.title,content:$('#edit').value})});toast('Material yeniləndi')}
async function load(m){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.module===m));$('#side').classList.remove('open');if(m==='dashboard'){const d=await api('/api/dashboard');$('#main').innerHTML=dashboard(d)}else if(m==='works'){const a=await api('/api/materials');$('#main').innerHTML=`<div class="workspace"><h2>🗂 İşlərim</h2><div class="table-wrap"><table class="table"><tr><th>Ad</th><th>Modul</th><th>Tarix</th><th>Əməliyyat</th></tr>${a.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.module)}</td><td>${esc(x.updated_at)}</td><td><button class="btn ghost" onclick="openMaterial(${x.id})">Aç / Redaktə et</button> <button class="btn danger" onclick="deleteMaterial(${x.id})">Sil</button></td></tr>`).join('')}</table></div></div>`}else if(m==='about')$('#main').innerHTML=`<div class="about"><div class="workspace"><h2>ℹ️ Haqqında</h2><p>Müəllimin AI Köməkçisi müəllimlərin tədris, planlaşdırma, qiymətləndirmə, metodik fəaliyyət və rəqəmsal materialların hazırlanması proseslərini süni intellekt vasitəsilə daha səmərəli həyata keçirməsi üçün hazırlanmış rəqəmsal təhsil platformasıdır.</p></div><div class="workspace"><h2>Təsisçi və Təlimçi</h2><h3>Tacəddin İbadov</h3><p>📞 +994 55 670 71 16</p><p>📧 t.ibadov88@gmail.com</p></div></div>`;else $('#main').innerHTML=moduleView(m);$('#main').querySelector('#file')?.addEventListener('change',e=>$('#fileName').textContent=e.target.files[0]?`Seçilmiş fayl: ${e.target.files[0].name}`:'')}
async function deleteMaterial(id){if(!confirm('Material silinsin?'))return;await api('/api/materials/'+id,{method:'DELETE'});load('works')}
$('#loginBtn').onclick=login;$('#code').addEventListener('keydown',e=>e.key==='Enter'&&login());$('#logout').onclick=logout;$('#hamb').onclick=()=>$('#side').classList.toggle('open');document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>load(x.dataset.module));if(S.sid){showApp();load('dashboard').catch(logout)}
</script></body></html>
