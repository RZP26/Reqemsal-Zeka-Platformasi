<!doctype html>
<html lang="az">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peşə Təhsili | 20 Suallıq İmtahan</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:22px}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #00000012}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.badge{background:#eef2ff;padding:8px 12px;border-radius:999px;font-weight:700}.q{font-size:20px;line-height:1.45}.opt{display:block;border:1px solid #dce3ef;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer}.opt:hover{background:#f6f8fc}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#315efb;color:#fff}.secondary{background:#eef2f7}.hidden{display:none}.score{font-size:28px;font-weight:900}.wrong{border-left:4px solid #e55353;padding:12px;margin:10px 0;background:#fff4f4}.right{color:#16834b;font-weight:800}small{color:#667085}</style></head>
<body><div class="wrap"><div class="card"><div class="top"><div><h1>Peşə Təhsili üzrə İmtahan</h1><small>Bütün mövzular üzrə qarışıq suallar</small></div><span class="badge" id="progress">1 / 20</span></div></div><div id="exam"></div><div class="card hidden" id="result"></div></div>
<script>
let allQuestions=[];let exam=[];let answers=[];let current=0;let used=JSON.parse(localStorage.getItem('pt_used')||'[]');
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function init(){try{let r=await fetch('peshe-tehsili-imtahan-data.json',{cache:'no-store'});allQuestions=await r.json();startExam()}catch(e){document.getElementById('exam').innerHTML='<div class="card">Sual bazası yüklənmədi.</div>'}}
function startExam(){let pool=allQuestions.filter(q=>!used.includes(q.id));if(pool.length<20){used=[];localStorage.setItem('pt_used','[]');pool=allQuestions}exam=shuffle(pool.slice()).slice(0,20);exam=exam.map(q=>({...q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.a}))) }));answers=Array(20).fill(null);current=0;document.getElementById('result').classList.add('hidden');render()}
function render(){let q=exam[current];document.getElementById('progress').textContent=(current+1)+' / 20';let html='<div class="card"><div class="q"><b>'+q.n+'.</b> '+q.q+'</div>'+q.opts.map((o,i)=>`<label class="opt"><input type="radio" name="q" value="${i}" ${answers[current]===i?'checked':''} onchange="answers[${current}]=${i}"> ${String.fromCharCode(65+i)}) ${o.t}</label>`).join('')+'<small>Mənbə: '+q.src+'</small><div class="actions">'+(current?'<button class="btn secondary" onclick="current--;render()">Geri</button>':'')+(current<19?'<button class="btn primary" onclick="next()">Növbəti</button>':'<button class="btn primary" onclick="finish()">İmtahanı bitir</button>')+'</div></div>';document.getElementById('exam').innerHTML=html}
function next(){if(answers[current]===null){alert('Zəhmət olmasa cavab seçin.');return}current++;render()}
function finish(){if(answers[current]===null){alert('Zəhmət olmasa cavab seçin.');return}let correct=0, wrong=[];exam.forEach((q,qi)=>{let ok=q.opts[answers[qi]].ok;if(ok)correct++;else wrong.push({q,sel:q.opts[answers[qi]]})});used=[...used,...exam.map(q=>q.id)];localStorage.setItem('pt_used',JSON.stringify(used));let h='<div class="card"><div class="score">Nəticə: '+correct+' doğru, '+(20-correct)+' səhv</div><p><b>'+correct*5+' / 100 bal</b></p>'+(wrong.length?'<h3>Səhv cavabların düzgün variantları</h3>'+wrong.map((w,i)=>`<div class="wrong"><b>${i+1}. ${w.q.q}</b><br>Sizin cavab: ${w.sel.t}<br><span class="right">Düzgün cavab: ${w.q.opts.find(o=>o.ok).t}</span><br><small>Mənbə: ${w.q.src}</small></div>`).join(''):'<p class="right">Təbrik edirik! Bütün cavablar doğrudur.</p>')+'<div class="actions"><button class="btn primary" onclick="startExam()">Yenilə və növbəti 20 sual</button></div></div>';document.getElementById('exam').innerHTML=h;document.getElementById('result').classList.add('hidden')}
init();
</script></body></html>
