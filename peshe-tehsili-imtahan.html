<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peşə Təhsili | İmtahan</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #0001}.top{display:flex;justify-content:space-between;gap:10px}.badge{background:#eef2ff;padding:8px 12px;border-radius:999px;font-weight:700}.q{font-size:20px;line-height:1.5}.opt{display:block;border:1px solid #dce3ef;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer}.opt:hover{background:#f6f8fc}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#315efb;color:#fff}.secondary{background:#eef2f7}.score{font-size:28px;font-weight:900}.wrong{border-left:4px solid #e55353;background:#fff4f4;padding:12px;margin:10px 0}.right{color:#16834b;font-weight:800}small{color:#667085}</style></head><body><div class="wrap"><div class="card top"><div><h1>Peşə Təhsili üzrə İmtahan</h1><small>Bütün mövzular üzrə qarışıq 20 sual</small></div><span class="badge" id="progress">1 / 20</span></div><div id="app"></div></div><script>let bank=[],exam=[],ans=[],cur=0,used=JSON.parse(localStorage.getItem('pt_used')||'[]');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}async function init(){try{let r=await fetch('peshe-tehsili-imtahan-data.json',{cache:'no-store'});bank=await r.json()}catch(e){bank=[]}if(!bank.length){document.getElementById('app').innerHTML='<div class="card">Sual bazası yüklənmədi.</div>';return}start()}function start(){let pool=bank.filter(q=>!used.includes(q.id));if(pool.length<20){used=[];localStorage.setItem('pt_used','[]');pool=bank}exam=shuffle(pool.slice()).slice(0,20);exam=exam.map(q=>({...q,opts:shuffle(q.opts.slice())}));ans=Array(20).fill(null);cur=0;render()}function render(){let q=exam[cur];document.getElementById('progress').textContent=(cur+1)+' / 20';document.getElementById('app').innerHTML='<div class="card"><div class="q"><b>'+esc(q.n)+'.</b> '+esc(q.q)+'</div>'+q.opts.map((o,i)=>'<label class="opt"><input type="radio" name="a" value="'+i+'" '+(ans[cur]===i?'checked':'')+' onchange="ans[cur]='+i+'"> '+String.fromCharCode(65+i)+') '+esc(o.t)+'</label>').join('')+'<small>Mənbə: '+esc(q.src)+'</small><div class="actions">'+(cur?'<button class="btn secondary" onclick="cur--;render()">Geri</button>':'')+(cur<19?'<button class="btn primary" onclick="next()">Növbəti</button>':'<button class="btn primary" onclick="finish()">İmtahanı bitir</button>')+'</div></div>'}function next(){if(ans[cur]===null)return alert('Zəhmət olmasa cavab seçin.');cur++;render()}function finish(){if(ans[cur]===null)return alert('Zəhmət olmasa cavab seçin.');let good=0,wrong=[];exam.forEach((q,i)=>{if(q.opts[ans[i]].ok)good++;else wrong.push({q,sel:q.opts[ans[i]]})});used=[...used,...exam.map(q=>q.id)];localStorage.setItem('pt_used',JSON.stringify(used));let html='<div class="card"><div class="score">Nəticə: '+good+' doğru, '+(20-good)+' səhv</div><p><b>'+good*5+' / 100 bal</b></p>';if(wrong.length)html+='<h3>Səhv cavablar və düzgün variantlar</h3>'+wrong.map(w=>'<div class="wrong"><b>'+esc(w.q.q)+'</b><br>Sizin cavab: '+esc(w.sel.t)+'<br><span class="right">Düzgün cavab: '+esc(w.q.opts.find(o=>o.ok).t)+'</span><br><small>Mənbə: '+esc(w.q.src)+'</small></div>').join('');else html+='<p class="right">Bütün cavablar doğrudur.</p>';html+='<div class="actions"><button class="btn primary" onclick="start()">Yenilə və növbəti 20 sual</button></div></div>';document.getElementById('app').innerHTML=html}init();</script></body></html>
